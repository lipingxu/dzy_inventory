<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Detail Template</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; margin: 40px; color: #111827; }
    .box { max-width: 760px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 10px 24px rgba(0,0,0,.04); }
    .tag { display: inline-block; background: #e0f2fe; color: #075985; padding: 4px 10px; border-radius: 999px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>书籍详情模板</h1>
    <div class="tag">Template only</div>
    <p>此仓库不包含真实库存记录，详情页展示的是模板内容。</p>
    <ul>
      <li>书名：示例书名 1</li>
      <li>ISBN：9780000000001</li>
      <li>状态：持有</li>
      <li>当前价格：示例价</li>
    </ul>
  </div>
</body>
</html>
